<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="946 contribuciones · Racha actual: 5 · Racha más larga: 6">
<style>
  .rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .ring{stroke-dasharray:289.03;stroke-dashoffset:289.03;animation:ring 1.6s cubic-bezier(.2,.8,.2,1) .3s forwards}
  @keyframes ring{to{stroke-dashoffset:82.58}}
  .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .flame{transform-box:fill-box;transform-origin:center bottom;animation:flicker 1.8s ease-in-out infinite}
  @keyframes flicker{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(-3deg)}}
  @media (prefers-reduced-motion:reduce){.rise,.bar,.flame{animation:none}.ring{animation:none;stroke-dashoffset:82.58}}
</style>
